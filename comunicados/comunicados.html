<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comunicados | Curriculo</title>
  <link rel="stylesheet" href="../menu-superior/menu-superior.css?v=20260804-1" />
  <link rel="stylesheet" href="./comunicados.css?v=20260713-7" />
  <style>
    .com-logo-ready{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #d8e2ef;border-radius:12px;background:#f8fafc}.com-logo-ready strong{display:block}.com-logo-mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e7f6ec;color:#087f5b;font-weight:900}
  </style>
</head>
<body>
  <div class="com-page">
    <header class="com-header">
      <div><h1>Comunicados</h1></div>
      <div class="com-header-actions">
        <button id="btnRecargar" type="button" class="com-btn com-btn-light">Recargar</button>
        <a href="../subir/subir.html" class="com-btn com-btn-light">Subir ZIP</a>
      </div>
    </header>

    <section id="comEstado" class="com-status com-status-neutral">
      <div class="com-status-dot"></div><div><strong>Inicializando</strong><span>Conectando...</span></div>
    </section>

    <section class="com-panel">
      <div class="com-form-grid">
        <div class="com-field"><label for="selectorCarrera">Carrera</label><select id="selectorCarrera"><option value="">Cargando...</option></select></div>
        <div class="com-field"><label for="inputFecha">Fecha</label><input id="inputFecha" type="date" /></div>
        <div class="com-field"><label for="inputCiudad">Ciudad</label><input id="inputCiudad" type="text" value="Quito, D.M." /></div>
        <div class="com-field"><label for="inputUnidadResponsable">Unidad</label><input id="inputUnidadResponsable" type="text" value="Unidad Gestión de Procesos Académicos" /></div>
        <div class="com-field com-field-full"><label for="inputNota">Pie</label><input id="inputNota" type="text" value="Instituto Superior Tecnológico Quito Metropolitano" /></div>
        <input id="inputLogoSrc" type="hidden" value="../assets/logo-itsqmet-comunicado-oficial.png" />
        <div class="com-field com-field-full"><div class="com-logo-ready"><div class="com-logo-mark">✓</div><div><strong>Logo configurado</strong></div></div></div>
      </div>
    </section>

    <section class="com-stats">
      <article><span>Materias</span><strong id="statTotalMaterias">0</strong></article>
      <article class="com-stat-ok"><span>Completas</span><strong id="statCompletas">0</strong></article>
      <article class="com-stat-warn"><span>Revisión</span><strong id="statRevision">0</strong></article>
      <article class="com-stat-error"><span>Incompletas</span><strong id="statIncompletas">0</strong></article>
      <article><span>Mostradas</span><strong id="statMostradas">0</strong></article>
      <article><span>Seleccionadas</span><strong id="statSeleccionadas">0</strong></article>
    </section>

    <section class="com-panel com-actions-panel">
      <div><h2>Generar</h2></div>
      <div class="com-actions-row">
        <button id="btnSeleccionarTodas" type="button" class="com-btn com-btn-light">Seleccionar todas</button>
        <button id="btnLimpiarSeleccion" type="button" class="com-btn com-btn-light">Limpiar</button>
        <button id="btnGenerarSeleccionadas" type="button" class="com-btn com-btn-primary">Generar selección</button>
        <button id="btnGenerarTodas" type="button" class="com-btn com-btn-dark">Generar todas</button>
      </div>
    </section>

    <section class="com-panel">
      <div class="com-panel-head"><div><h2>Materias</h2></div></div>
      <div class="com-table-wrap">
        <table class="com-table">
          <thead><tr><th>Sel.</th><th>Nivel</th><th>Código</th><th>Nombre importado</th><th>Nombre institucional</th><th>Estado</th><th>PEA</th><th>Acciones</th></tr></thead>
          <tbody id="tablaMaterias"><tr><td colspan="8" class="com-empty">Selecciona una carrera.</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="../menu-superior/menu-superior.js?v=20260804-2"></script>
  <script src="../firebase/firebase.inteligencia.js?v=20260728-1"></script>
  <script src="../firebase/firebase.inteligencia-v2.js?v=20260728-2"></script>
  <script src="../firebase/firebase.inteligencia-v2-ajustes.js?v=20260728-3"></script>
  <script src="../firebase/firebase.curriculo.js?v=20260728-1"></script>
  <script src="../firebase/firebase.robustez.js?v=20260728-2"></script>
  <script src="../firebase/firebase.robustez-ajustes.js?v=20260728-3"></script>
  <script src="../assets/logo-itsqmet-comunicado-data.js?v=20260716-4"></script>
  <script src="./comunicados.bdlocal.js?v=20260728-1"></script>
  <script src="./comunicados.contador.js?v=20260728-2"></script>
  <script src="./comunicados.plantilla.js?v=20260716-4"></script>
  <script src="./comunicados.ajustes-portada.js?v=20260716-4"></script>
  <script src="./comunicados.pdf.js?v=20260717-1"></script>
  <script src="./comunicados.formato-oficial.js?v=20260716-4"></script>
  <script src="./comunicados.portada-final.js?v=20260717-1"></script>
  <script src="./comunicados.portada-estilo-final.js?v=20260716-4"></script>
  <script src="./comunicados.estilo-tecnico.js?v=20260716-1"></script>
  <script src="./comunicados.orden-contenidos.js?v=20260716-1"></script>
  <script src="./comunicados.firma-fija.js?v=20260716-1"></script>
  <script src="./comunicados.main.js?v=20260728-1"></script>
  <script src="./comunicados.reservas-ui.js?v=20260728-2"></script>
  <script src="./comunicados.firebase-ui.js?v=20260728-1"></script>
</body>
</html>
