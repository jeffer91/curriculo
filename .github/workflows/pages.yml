name: Publicar aplicación de usuarios

on:
  push:
    branches:
      - app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar rama app
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar solo la aplicación pública
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp app.css _site/app.css
          cp app.js _site/app.js
          cp assets/logo-itsqmet-comunicado-oficial.svg _site/assets/logo-itsqmet-comunicado-oficial.svg
          touch _site/.nojekyll

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
