name: Validar aplicación pública

on:
  push:
    branches:
      - app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama app
        uses: actions/checkout@v6

      - name: Verificar archivos públicos
        run: |
          test -f index.html
          test -f app.css
          test -f app.js
          test -f assets/logo-itsqmet-comunicado-oficial.svg

      - name: Verificar JavaScript
        run: node --check app.js
