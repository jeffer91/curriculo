name: Verificar Firebase y versionado

on:
  push:
    paths:
      - "firebase/**"
      - "bdlocal/**"
      - "subir/**"
      - "mallas/**"
      - "estadisticas/**"
      - "diagnostico/**"
      - "menu-superior/**"
      - "comunicados/**"
      - "scripts/firebase-*.test.js"
      - "scripts/mallas-*.test.js"
      - "scripts/subir-*.test.js"
      - "scripts/estadisticas.test.js"
      - "scripts/comunicados-contador-firebase.test.js"
      - "package.json"
      - ".github/workflows/firebase-check.yml"
  pull_request:
    paths:
      - "firebase/**"
      - "bdlocal/**"
      - "subir/**"
      - "mallas/**"
      - "estadisticas/**"
      - "diagnostico/**"
      - "menu-superior/**"
      - "comunicados/**"
      - "scripts/firebase-*.test.js"
      - "scripts/mallas-*.test.js"
      - "scripts/subir-*.test.js"
      - "scripts/estadisticas.test.js"
      - "scripts/comunicados-contador-firebase.test.js"
      - "package.json"
      - ".github/workflows/firebase-check.yml"

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar sintaxis crítica
        run: |
          node --check diagnostico/diagnostico-flujo.js
          node --check diagnostico/subir-diagnostico.js
          node --check bdlocal/bdlocal.schema.js
          node --check bdlocal/bdlocal.core.js
          node --check bdlocal/bdlocal.importador.js
          node --check bdlocal/bdlocal.api.js
          node --check bdlocal/local.ui.js
          node --check firebase/firebase.inteligencia.js
          node --check firebase/firebase.inteligencia-v2.js
          node --check firebase/firebase.inteligencia-v2-ajustes.js
          node --check firebase/firebase.transversales.js
          node --check firebase/firebase.curriculo.js
          node --check firebase/firebase.estadisticas.js
          node --check firebase/firebase.robustez.js
          node --check firebase/firebase.robustez-ajustes.js
          node --check firebase/firebase.importacion-parcial.js
          node --check firebase/firebase.mallas.js
          node --check firebase/firebase.mallas-integracion.js
          node --check mallas/mallas.parser.js
          node --check mallas/mallas.comparador.js
          node --check mallas/mallas.transversales.js
          node --check mallas/mallas.main.js
          node --check estadisticas/estadisticas.js
          node --check subir/subir.transversales.js
          node --check subir/subir.conexion-bdlocal.js
          node --check subir/subir.filtro-importacion.js
          node --check subir/subir.importacion-parcial-ui.js
          node --check subir/subir.firebase-ui.js
          node --check subir/subir.malla-ui.js
          node --check comunicados/comunicados.contador.js
          node --check comunicados/comunicados.reservas-ui.js

      - name: Ejecutar pruebas de mallas
        run: node scripts/mallas-curriculares.test.js

      - name: Ejecutar pruebas de estadísticas
        run: node scripts/estadisticas.test.js

      - name: Ejecutar pruebas de guardado local y sincronización
        run: node scripts/subir-conexion-hibrida.test.js

      - name: Ejecutar pruebas de materias transversales
        run: |
          node scripts/subir-transversales.test.js
          node scripts/firebase-transversales.test.js

      - name: Ejecutar pruebas de robustez
        run: |
          node scripts/firebase-inteligencia.test.js
          node scripts/firebase-transversales.test.js
          node scripts/firebase-robustez.test.js
          node scripts/firebase-ajustes.test.js
          node scripts/firebase-importacion-parcial.test.js
          node scripts/comunicados-contador-firebase.test.js

      - name: Ejecutar pruebas del flujo existente
        run: npm test
